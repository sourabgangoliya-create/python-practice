<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; }
        canvas { display: block; background-color: #111; }
    </style>
</head>
<body>

    <canvas id="creatureCanvas"></canvas>

<script>
const canvas = document.getElementById("creatureCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let mouse = { x: canvas.width / 2, y: canvas.height / 2 };

window.addEventListener("mousemove", (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

const numSegments = 20;
const segmentLength = 15;
let spine = [];

for (let i = 0; i < numSegments; i++) {
    spine.push({ x: mouse.x, y: mouse.y });
}

function animate(time) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    spine[0].x += (mouse.x - spine[0].x) * 0.1;
    spine[0].y += (mouse.y - spine[0].y) * 0.1;

    for (let i = 1; i < numSegments; i++) {
        let dx = spine[i - 1].x - spine[i].x;
        let dy = spine[i - 1].y - spine[i].y;
        let distance = Math.sqrt(dx * dx + dy * dy);

        if (distance > segmentLength) {
            spine[i].x = spine[i - 1].x - (dx / distance) * segmentLength;
            spine[i].y = spine[i - 1].y - (dy / distance) * segmentLength;
        }
    }

    ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
    ctx.lineWidth = 2;

    for (let i = 0; i < numSegments; i++) {
        let curr = spine[i];
        let next = spine[i + 1] || spine[i];
        let angle = Math.atan2(next.y - curr.y, next.x - curr.x);
        let ribLength = Math.sin((i / numSegments) * Math.PI) * 40;

        let leftX = curr.x + Math.cos(angle + Math.PI / 2) * ribLength;
        let leftY = curr.y + Math.sin(angle + Math.PI / 2) * ribLength;
        let rightX = curr.x + Math.cos(angle - Math.PI / 2) * ribLength;
        let rightY = curr.y + Math.sin(angle - Math.PI / 2) * ribLength;

        ctx.beginPath();
        ctx.moveTo(leftX, leftY);
        ctx.lineTo(curr.x, curr.y);
        ctx.lineTo(rightX, rightY);
        ctx.stroke();

        if (i === 4 || i === 9 || i === 14) {
            ctx.strokeStyle = "#ffffff";
            let wave = Math.sin(time * 0.01 + i) * 20;

            let legLX = leftX + Math.cos(angle + Math.PI / 3) * (20 + wave);
            let legLY = leftY + Math.sin(angle + Math.PI / 3) * (20 + wave);
            ctx.beginPath(); ctx.moveTo(curr.x, curr.y); ctx.lineTo(leftX, leftY); ctx.lineTo(legLX, legLY); ctx.stroke();

            let legRX = rightX + Math.cos(angle - Math.PI / 3) * (20 - wave);
            let legRY = rightY + Math.sin(angle - Math.PI / 3) * (20 - wave);
            ctx.beginPath(); ctx.moveTo(curr.x, curr.y); ctx.lineTo(rightX, rightY); ctx.lineTo(legRX, legRY); ctx.stroke();
            
            ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
        }
    }

    requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>

</body>
</html>
